name: Build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Inspect rendered pages
        run: |
          echo "GENERATED HTML PAGES:"
          find _site -name '*.html' | sort
          echo "PUBLICATIONS PAGE HEADINGS:"
          grep -o '<h2 class="archive__item-title"[^>]*>[^<]*</h2>' _site/publications/index.html || true
          echo "ABOUT VENUE MENTIONS:"
          grep -o 'arXiv\|EMNLP 2024\|ICML 2024\|NeurIPS 2023' _site/index.html | sort | uniq -c || true
          echo "ABOUT CONTACT LINKS:"
          grep -o 'jliugi@connect.ust.hk\|github.com/Vicent0205\|twitter.com/junteng88716710\|scholar.google.com[^" ]*' _site/index.html | sort -u || true
          echo "BASEURL LINK CHECK:"
          grep -o 'href="[^"]*LJT-Homepage/publications/"' _site/index.html | sort -u || true
